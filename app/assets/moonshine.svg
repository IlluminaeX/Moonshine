<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#271e30"/>
      <stop offset="0.6" stop-color="#19131f"/>
      <stop offset="1" stop-color="#0e0a14"/>
    </radialGradient>
    <!-- Outer corona: soft crimson glow fading out -->
    <radialGradient id="corona" cx="50%" cy="50%" r="50%">
      <stop offset="0.55" stop-color="#cf3a5a" stop-opacity="1"/>
      <stop offset="0.68" stop-color="#972847" stop-opacity="0.75"/>
      <stop offset="0.82" stop-color="#611a33" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#4f1228" stop-opacity="0"/>
    </radialGradient>
    <!-- The moon: near-black with a faint red earthshine -->
    <radialGradient id="moon" cx="40%" cy="38%" r="70%">
      <stop offset="0" stop-color="#1d1019"/>
      <stop offset="0.7" stop-color="#0c0810"/>
      <stop offset="1" stop-color="#08050c"/>
    </radialGradient>
    <radialGradient id="flare" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff2f3"/>
      <stop offset="0.25" stop-color="#f27b93"/>
      <stop offset="0.6" stop-color="#cf3a5a" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#cf3a5a" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <rect width="256" height="256" rx="56" fill="url(#bg)"/>

  <!-- Corona and its bright inner rim -->
  <circle cx="128" cy="128" r="104" fill="url(#corona)"/>
  <circle cx="128" cy="128" r="66" fill="none" stroke="#d63f60" stroke-width="7" filter="url(#soft)"/>
  <circle cx="128" cy="128" r="64" fill="none" stroke="#f06f89" stroke-width="2.5"/>

  <!-- Moon, nudged down-left so a sliver of crimson light shows top-right -->
  <circle cx="124" cy="132" r="63" fill="url(#moon)"/>

  <!-- Diamond-ring flare where the sun peeks out -->
  <circle cx="173" cy="84" r="24" fill="url(#flare)"/>
  <circle cx="173" cy="84" r="4.5" fill="#fff6f7"/>
</svg>
